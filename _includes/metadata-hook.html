<!-- Custom metadata and styles -->

{% if page.layout == 'post' %}
<style>
/* 页面切换淡入效果 */
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
article.has-toc { animation: fadeSlideIn 0.4s ease-out; }

/* 左侧目录：固定定位，不挤压文章 */
.toc-left-sidebar {
  position: fixed;
  left: 0; top: 3.5rem;
  width: 260px; height: calc(100vh - 3.5rem);
  font-size: 0.875rem;
  background: var(--card-bg, var(--main-bg));
  border: 1px solid var(--main-border-color); border-left: none;
  border-radius: 0 8px 8px 0;
  box-shadow: 2px 0 8px rgba(0,0,0,0.06);
  display: flex; flex-direction: column;
  overflow: visible;
  z-index: 50;
  transition: transform 0.3s ease;
}

.toc-left-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--main-border-color);
  flex-shrink: 0;
  cursor: default;
  user-select: none;
}
.toc-left-title {
  font-weight: 600; color: var(--heading-color); font-size: 0.95rem;
}

/* 内容收起按钮（标题旁 ±） */
.toc-content-toggle {
  background: none; border: 1px solid var(--btn-border-color);
  border-radius: 4px; padding: 2px 7px;
  cursor: pointer; color: var(--text-muted-color);
  font-size: 1rem; line-height: 1; font-family: monospace;
  transition: all 0.2s; flex-shrink: 0;
}
.toc-content-toggle:hover { color: var(--toc-highlight); border-color: var(--toc-highlight); }

.toc-left-body {
  overflow-y: auto; flex: 1;
  scrollbar-width: thin; padding: 0.5rem 0;
}
.toc-left-body::-webkit-scrollbar { width: 3px; }
.toc-left-body::-webkit-scrollbar-thumb { background: var(--text-muted-color); border-radius: 2px; }

/* 覆盖主题默认的 toc-wrapper 样式 */
.toc-left-sidebar #toc-wrapper {
  position: static !important; max-height: none;
  margin-top: 0 !important; padding: 0 !important;
}
.toc-left-sidebar .toc-link {
  display: block; padding: 0.3rem 1rem; color: var(--text-muted-color);
  text-decoration: none; border-left: 2px solid transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.toc-left-sidebar .toc-link:hover {
  color: var(--toc-highlight); text-decoration: none;
  border-left-color: var(--toc-highlight); background: var(--sidebar-hover-bg);
}
.toc-left-sidebar .is-active-link {
  color: var(--toc-highlight) !important; font-weight: 600;
  border-left-color: var(--toc-highlight);
  background: var(--sidebar-hover-bg);
}
.toc-left-sidebar .toc-link::before { display: none !important; }
.toc-left-sidebar .toc-list { list-style: none; padding-left: 0; margin: 0; }
.toc-left-sidebar .toc-list .toc-list { padding-left: 1rem; }
.toc-left-sidebar .toc-list-item { margin: 0; }

/* 目录内容折叠：整个框收起，只留标题栏 */
.toc-left-sidebar.content-collapsed {
  height: auto;
  border-radius: 0 8px 8px 0;
}
.toc-left-sidebar.content-collapsed .toc-left-body { display: none; }
.toc-left-sidebar.content-collapsed .toc-left-header { border-bottom: none; }

/* 整个目录栏折叠（右侧箭头） */
.toc-sidebar-toggle-btn {
  position: absolute; right: -28px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 56px;
  background: var(--card-bg, var(--main-bg));
  border: 1px solid var(--main-border-color); border-left: none;
  border-radius: 0 6px 6px 0;
  cursor: pointer; color: var(--text-muted-color);
  font-size: 0.7rem; line-height: 56px; text-align: center;
  z-index: 5; padding: 0;
  box-shadow: 2px 0 4px rgba(0,0,0,0.06);
  transition: background 0.2s, color 0.2s;
}
.toc-sidebar-toggle-btn:hover { color: var(--toc-highlight); background: var(--sidebar-hover-bg); }
.toc-sidebar-toggle-btn i { pointer-events: none; transition: transform 0.3s ease; }

/* 整个目录栏滑出屏幕 */
.toc-left-sidebar.sidebar-collapsed {
  transform: translateX(-260px);
}
.toc-left-sidebar.sidebar-collapsed .toc-sidebar-toggle-btn i { transform: rotate(180deg); }

@media (max-width: 1199px) { .toc-left-sidebar { display: none !important; } }

/* 文章页：加宽主内容区，减少左右空白 */
@media (min-width: 1200px) {
  .row .col-xl-9 {
    flex: 0 0 auto;
    width: 83.333% !important;
  }
  .row .col-xl-3 {
    flex: 0 0 auto;
    width: 16.667% !important;
  }
}
</style>
{% endif %}

<!-- 顶部导航栏样式 -->
<style>
#topbar-wrapper {
  border-bottom: 1px solid var(--main-border-color);
  background: var(--main-bg);
}
#topbar {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1rem;
  height: 3.5rem;
  gap: 0.5rem;
}
.topbar-brand {
  flex-shrink: 0;
  color: var(--heading-color);
}
.topbar-brand:hover {
  opacity: 0.85;
}
.topbar-avatar {
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 0 0 2px var(--sidebar-border-color);
}
.topbar-title {
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--heading-color);
}
.topbar-nav {
  gap: 0.25rem;
}
.topbar-link {
  padding: 0.4rem 0.75rem;
  border-radius: 0.5rem;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text-muted-color);
  text-decoration: none;
  white-space: nowrap;
  transition: background-color 0.15s, color 0.15s;
}
.topbar-link:hover {
  color: var(--heading-color);
  background: var(--sidebar-hover-bg);
  text-decoration: none;
}
.topbar-link.active {
  color: var(--sidebar-active-color);
  background: var(--sidebar-hover-bg);
}
.topbar-btn {
  width: 2rem;
  height: 2rem;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: var(--text-muted-color);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  flex-shrink: 0;
}
.topbar-btn:hover {
  color: var(--heading-color);
  background: var(--sidebar-hover-bg);
}
.topbar-actions {
  gap: 0.25rem;
}
#sidebar-trigger { display: none; }

/* 无侧边栏后，主内容区不需要左边距 */
@media (min-width: 1200px) {
  #main-wrapper {
    margin-left: 0 !important;
  }
}

/* 移动端适配 */
@media (max-width: 849px) {
  .topbar-nav { display: none; }
  .topbar-title { display: none; }
  #sidebar-trigger { display: flex; }
}
@media (max-width: 575px) {
  .topbar-brand { display: none; }
}

/* 首页卡片 hover 整卡统一高亮 + 分隔线 */
#post-list .card-wrapper {
  border-radius: 0.75rem;
  overflow: hidden;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--main-border-color);
  padding-bottom: 1rem;
}
#post-list .post-preview {
  border-radius: 0.75rem;
  transition: box-shadow 0.2s, transform 0.2s;
  display: block;
}
#post-list .post-preview:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  transform: translateY(-1px);
}
#post-list .card-body {
  background: var(--card-bg, var(--main-bg));
}
#post-list .post-preview:hover .card-title {
  color: var(--toc-highlight, #d2603a);
  transition: color 0.2s ease;
}
#post-list .card-title {
  transition: color 0.2s ease;
}
#post-list .card-tag-item {
  font-weight: 400;
  font-size: 0.78rem;
  padding: 1px 8px;
  border-radius: 4px;
  background: var(--sidebar-hover-bg);
  color: var(--text-muted-color);
  border: 1px solid var(--main-border-color);
}
</style>
