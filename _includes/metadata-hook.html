<!-- A placeholder to allow defining custom metadata -->

{% if page.layout == 'post' %}
<style>
/* 左侧目录侧边栏 */
.post-with-toc { display: flex; gap: 0; position: relative; }
.toc-left-sidebar { width: 260px; min-width: 260px; position: sticky; top: 5rem; align-self: flex-start; max-height: calc(100vh - 7rem); border-right: 1px solid var(--main-border-color); margin-right: 2rem; padding-right: 1rem; transition: all 0.3s ease; font-size: 0.875rem; background: var(--main-bg); }
.toc-left-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 0.75rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--main-border-color); }
.toc-left-title { font-weight: 600; color: var(--heading-color); font-size: 0.95rem; }
.toc-left-toggle { background: none; border: 1px solid var(--btn-border-color); border-radius: 4px; padding: 4px 8px; cursor: pointer; color: var(--text-muted-color); font-size: 0.85rem; line-height: 1; transition: all 0.3s; flex-shrink: 0; }
.toc-left-toggle:hover { color: var(--toc-highlight); border-color: var(--toc-highlight); }
.toc-left-toggle i { transition: transform 0.3s ease; pointer-events: none; }
.toc-left-body { overflow-y: auto; max-height: calc(100vh - 12rem); scrollbar-width: thin; }
.toc-left-body::-webkit-scrollbar { width: 3px; }
.toc-left-body::-webkit-scrollbar-thumb { background: var(--text-muted-color); border-radius: 2px; }
.toc-left-sidebar #toc-wrapper { position: static !important; max-height: none; margin-top: 0; padding: 0 !important; }
.toc-left-sidebar .toc-link { display: block; padding: 0.25rem 0; color: var(--text-muted-color); text-decoration: none; border-left: 2px solid transparent; padding-left: 0.75rem; transition: all 0.15s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toc-left-sidebar .toc-link:hover { color: var(--toc-highlight); text-decoration: none; border-left-color: var(--toc-highlight); }
.toc-left-sidebar .is-active-link { color: var(--toc-highlight) !important; font-weight: 600; border-left-color: var(--toc-highlight); }
.toc-left-sidebar .toc-link::before { display: none !important; }
.toc-left-sidebar .toc-list { list-style: none; padding-left: 0; margin: 0; }
.toc-left-sidebar .toc-list .toc-list { padding-left: 1rem; }
.toc-left-sidebar .toc-list-item { margin: 0; }
.toc-left-sidebar.collapsed { width: 40px; min-width: 40px; padding-right: 0; margin-right: 1rem; }
.toc-left-sidebar.collapsed .toc-left-title,
.toc-left-sidebar.collapsed .toc-left-body { display: none; }
.toc-left-sidebar.collapsed .toc-left-header { justify-content: center; border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
.toc-left-sidebar.collapsed .toc-left-toggle i { transform: rotate(180deg); }
@media (max-width: 1199px) { .toc-left-sidebar { display: none !important; } }
</style>
{% endif %}

<!-- 侧边栏折叠 CSS（内联避免 baseurl 问题） -->
<style>
.sidebar-collapse-btn {
  display: none;
  position: fixed;
  top: 0.75rem;
  left: 260px;
  transform: translateX(-50%);
  z-index: 1050;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid var(--sidebar-border-color, #e0e0e0);
  background: var(--sidebar-bg, #ffffff);
  color: var(--sidebar-btn-color, #999);
  cursor: pointer;
  font-size: 1rem;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  padding: 0;
  line-height: 1;
}

.sidebar-collapse-btn:hover {
  background: var(--sidebar-hover-bg, #f0f0f0);
  color: var(--sidebar-active-color, #2a408e);
  border-color: var(--sidebar-active-color, #2a408e);
}

.sidebar-collapse-btn i {
  transition: transform 0.3s ease;
  pointer-events: none;
}

/* 移动端不显示 */
@media (max-width: 1199px) {
  .sidebar-collapse-btn { display: none !important; }
}

/* 桌面端折叠功能 */
@media (min-width: 1200px) {
  .sidebar-collapse-btn { display: flex; }

  /* 折叠：侧边栏隐藏 */
  #sidebar.collapsed {
    width: 0 !important;
    min-width: 0 !important;
    overflow: hidden !important;
    border-right: none !important;
  }

  #sidebar.collapsed .profile-wrapper,
  #sidebar.collapsed nav,
  #sidebar.collapsed .sidebar-bottom {
    display: none !important;
  }

  /* 折叠后按钮移到最左侧 */
  #sidebar.collapsed ~ .sidebar-collapse-btn {
    left: 18px;
  }

  #sidebar.collapsed ~ .sidebar-collapse-btn i {
    transform: rotate(180deg);
  }

  /* 内容区填满 */
  #sidebar.collapsed ~ #main-wrapper {
    margin-left: 36px;
  }
}

/* 超大屏幕 */
@media (min-width: 1650px) {
  .sidebar-collapse-btn { left: 300px; }
}
</style>
